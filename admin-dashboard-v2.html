// === SCHÜLER ===
function SchuelerView({ refreshKey, reload }) {
  const service = useMemo(() => new window.KrsDataService(), []);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('alle');
  // v38: Mehrfach-Klassenfilter — leeres Set = alle Klassen (z.B. 7a UND 7d gleichzeitig wählbar)
  const [filterKlassen, setFilterKlassen] = useState(() => new Set());
  const [selectedCodes, setSelectedCodes] = useState(() => new Set());
  const [csvFile, setCsvFile] = useState(null);
  const [csvPreview, setCsvPreview] = useState(null);
  const [importing, setImporting] = useState(false);
  const [showCsvInfo, setShowCsvInfo] = useState(false); // Task #7
  // v38: Bulk-Zuordnung
  const [localKey, setLocalKey] = useState(0);
  const [assignOpen, setAssignOpen] = useState(false);
  const [assignProjektId, setAssignProjektId] = useState('');
  const [assignBusy, setAssignBusy] = useState(false);

  // Liste aller vorkommenden Klassen, alphabetisch sortiert (z.B. 5a, 5b, 6a …).
  // Wird als Klassenfilter-Dropdown angezeigt.
  const klassenListe = useMemo(() => {
    const set = new Set();
    mockSchueler.forEach(s => { if (s.klasse) set.add(String(s.klasse).toLowerCase()); });
    return Array.from(set).sort();
  }, [refreshKey, localKey, mockSchueler.length]);

  const klasseAktiv = filterKlassen.size > 0;
  // Dropdown bei Klick außerhalb schließen (native <details> macht das nicht selbst)
  useEffect(() => {
    const close = (e) => {
      const det = document.querySelector('.klassen-filter');
      if (det && det.open && !det.contains(e.target)) det.open = false;
    };
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, []);
  const toggleKlasse = (k) => {
    setFilterKlassen(prev => {
      const next = new Set(prev);
      if (next.has(k)) next.delete(k); else next.add(k);
      return next;
    });
  };
  const resetKlassen = () => setFilterKlassen(new Set());

  const gefiltert = mockSchueler.filter(s => {
    const q = search.toLowerCase();
    const aktiv = s.aktiv !== false; // undefined/true = aktiv
    const matchSearch = !q || s.vorname.toLowerCase().includes(q) || s.nachname.toLowerCase().includes(q) || s.code.toLowerCase().includes(q);
    // v40: Inaktive sind aus allen normalen Ansichten ausgeblendet.
    // Nur der Status-Filter "inaktiv" zeigt sie (ausgegraut).
    const matchFilter = filter === 'inaktiv' ? !aktiv
      : filter === 'angemeldet' ? (aktiv && s.hat_gewaehlt)
      : filter === 'fehlt' ? (aktiv && !s.hat_gewaehlt)
      : aktiv; // 'alle' = nur aktive
    const matchKlasse = !klasseAktiv || (s.klasse && filterKlassen.has(String(s.klasse).toLowerCase()));
    return matchSearch && matchFilter && matchKlasse;
  });

  // v40: Anzahl inaktiver Schüler (für Filter-Badge)
  const inaktivCount = useMemo(
    () => mockSchueler.filter(s => s.aktiv === false).length,
    [refreshKey, localKey, mockSchueler.length]
  );

  // Helfer für Checkbox-Logik
  const toggleSelect = (code) => {
    setSelectedCodes(prev => {
      const next = new Set(prev);
      if (next.has(code)) next.delete(code); else next.add(code);
      return next;
    });
  };
  const toggleSelectAllVisible = () => {
    setSelectedCodes(prev => {
      // v40: inaktive Schüler sind nicht auswählbar (keine Bulk-Aktionen)
      const visibleCodes = gefiltert.filter(s => s.aktiv !== false).map(s => s.code);
      const allSelected = visibleCodes.length > 0 && visibleCodes.every(c => prev.has(c));
      const next = new Set(prev);
      if (allSelected) visibleCodes.forEach(c => next.delete(c));
      else visibleCodes.forEach(c => next.add(c));
      return next;
    });
  };
  const clearSelection = () => setSelectedCodes(new Set());
  const selectableVisible = gefiltert.filter(s => s.aktiv !== false);
  const allVisibleSelected = selectableVisible.length > 0 && selectableVisible.every(s => selectedCodes.has(s.code));
  const someVisibleSelected = selectableVisible.some(s => selectedCodes.has(s.code)) && !allVisibleSelected;

  // ---- v38: Bulk-Zuordnung (Vorab-Zuordnung) ----------------------------
  // Nach Mutation: Demo re-rendert via localKey, Produktiv lädt via reload() neu.
  const afterMutation = () => {
    setLocalKey(k => k + 1);
    if (window.KRS_MODE === 'produktiv' && typeof reload === 'function') reload();
  };

  const doBulkAssign = async () => {
    if (!assignProjektId || selectedCodes.size === 0 || assignBusy) return;
    setAssignBusy(true);
    try {
      const r = await service.bulkAssign({ codes: Array.from(selectedCodes), projektId: assignProjektId });
      if (!r || r.success === false) {
        showToast('Zuordnung fehlgeschlagen: ' + ((r && r.error) || 'unbekannt'), 'error');
        return;
      }
      let msg = `📌 ${r.zugeordnet} Schüler → „${r.projekt_titel}" zugeordnet (${r.neue_belegung}/${r.max_plaetze} Plätze)`;
      const hinweise = [];
      if ((r.unbekannte_codes || []).length) hinweise.push(`${r.unbekannte_codes.length} Code(s) unbekannt`);
      if ((r.klassenstufen_hinweise || []).length) hinweise.push(`${r.klassenstufen_hinweise.length}× Klassenstufe außerhalb des Projekt-Rahmens`);
      if (r.ueberbucht) hinweise.push('Projekt ist jetzt überbucht');
      if (r.hinweis_entwurf) hinweise.push('Projekt ist noch im Entwurf — vor der Anmeldephase veröffentlichen');
      if (hinweise.length) msg += ' — Hinweise: ' + hinweise.join(' · ');
      showToast(msg, hinweise.length ? 'info' : 'success');
      setAssignOpen(false);
      clearSelection();
      afterMutation();
    } catch (e) {
      showToast('Fehler: ' + (e && e.message || e), 'error');
    } finally {
      setAssignBusy(false);
    }
  };

  const doBulkUnassign = async () => {
    if (selectedCodes.size === 0 || assignBusy) return;
    const betroffen = mockSchueler.filter(s => selectedCodes.has(s.code) && s.zuteilung).length;
    if (betroffen === 0) { showToast('Keine der ausgewählten Schüler hat eine Zuordnung', 'info'); return; }
    if (!window.confirm(`Zuordnung von ${betroffen} Schüler(n) wirklich aufheben?`)) return;
    setAssignBusy(true);
    try {
      const r = await service.bulkAssign({ codes: Array.from(selectedCodes), projektId: null });
      if (!r || r.success === false) {
        showToast('Aufheben fehlgeschlagen: ' + ((r && r.error) || 'unbekannt'), 'error');
        return;
      }
      showToast(`↩️ ${r.aufgehoben} Zuordnung(en) aufgehoben`, 'success');
      clearSelection();
      afterMutation();
    } catch (e) {
      showToast('Fehler: ' + (e && e.message || e), 'error');
    } finally {
      setAssignBusy(false);
    }
  };

  // v40: Schüler inaktiv setzen / reaktivieren.
  // Inaktiv = von Wahl + Verlosung ausgeschlossen. Beim Inaktiv-Setzen werden
  // Wahl & Zuteilung gelöscht (sauberer Schnitt) — daher Bestätigung mit Warnung.
  const doToggleAktiv = async (s) => {
    if (assignBusy) return;
    const istAktiv = (s.aktiv !== false);
    if (istAktiv) {
      const hatDaten = s.hat_gewaehlt || s.zuteilung;
      const warnung = hatDaten
        ? '\n\n⚠️ ' + (s.zuteilung ? 'Die vorhandene Zuteilung' : 'Die vorhandene Anmeldung') + ' wird dabei gelöscht.'
        : '';
      if (!window.confirm(
        `${s.vorname} ${s.nachname} (${s.klasse.toUpperCase()}) inaktiv setzen?\n\n` +
        `Der Schüler kann sich dann nicht mehr anmelden und wird bei der Verlosung ignoriert.` +
        warnung
      )) return;
    }
    setAssignBusy(true);
    try {
      const r = await service.setSchuelerAktiv({ code: s.code, aktiv: !istAktiv });
      if (!r || r.success === false) {
        showToast('Fehlgeschlagen: ' + ((r && r.error) || 'unbekannt'), 'error');
        return;
      }
      if (istAktiv) {
        const g = r.geloescht;
        let msg = `🚫 ${s.vorname} ${s.nachname} ist jetzt inaktiv`;
        if (g && (g.wahlen || g.zuteilungen)) msg += ` — Wahl/Zuteilung entfernt`;
        showToast(msg, 'success');
      } else {
        showToast(`✓ ${s.vorname} ${s.nachname} ist wieder aktiv`, 'success');
      }
      setSelectedCodes(prev => { const n = new Set(prev); n.delete(s.code); return n; });
      afterMutation();
    } catch (e) {
      showToast('Fehler: ' + (e && e.message || e), 'error');
    } finally {
      setAssignBusy(false);
    }
  };

  // v38: CSV-Export — Backup/Weiterverarbeitung. Exportiert die aktuell
  // gefilterte Liste (ohne Filter = alle) inkl. Status und Zuordnung.
  // Funktioniert in Demo UND Live (Daten sind gemountet).
  const exportSchuelerCSV = () => {
    const rows = gefiltert.length > 0 ? gefiltert : mockSchueler;
    const esc = (v) => {
      const s = String(v ?? '');
      return (s.includes(';') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const header = 'code;vorname;nachname;klasse;klassenstufe;status;zuteilung_projekt;fixiert';
    const lines = rows.map(s => [
      s.code, s.vorname, s.nachname, s.klasse, s.klassenstufe,
      (s.fixiert && s.zuteilung) ? 'zugeordnet' : (s.hat_gewaehlt ? 'angemeldet' : 'fehlt'),
      resolveProjektTitel(s.zuteilung) || '',
      s.fixiert ? 'ja' : 'nein'
    ].map(esc).join(';'));
    const csv = '﻿' + [header, ...lines].join('\r\n'); // BOM für Excel-Umlaute
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'schueler-export-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    showToast(`📤 ${rows.length} Schüler als CSV exportiert`, 'success');
  };

  // Projektliste fürs Zuordnungs-Modal: alle Projekte (auch Entwürfe — Vorab-Phase!),
  // mit aktueller Belegung aus den gemounteten Schülerdaten.
  const assignProjekte = useMemo(() => {
    return [...mockProjekteData]
      .map(p => ({
        ...p,
        belegt: mockSchueler.filter(s => s.zuteilung === p.id).length
      }))
      .sort((a, b) => String(a.titel).localeCompare(String(b.titel)));
  }, [refreshKey, localKey, assignOpen]);

  const handleCSVUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const csvText = evt.target.result;
        const { data, hasHeader } = parseCSV(csvText);

        // Validierung
        const preview = data.map(row => {
          const klasseFehler = !validateKlasse(row.klasse);
          const nameFehler = !row.vorname || !row.nachname;
          const isDuplicate = mockSchueler.some(s => s.vorname === row.vorname && s.nachname === row.nachname);

          return {
            ...row,
            valid: !klasseFehler && !nameFehler && !isDuplicate,
            errors: [
              klasseFehler ? 'Klasse ungültig (5-10 und Buchstabe)' : '',
              nameFehler ? 'Vor- oder Nachname fehlt' : '',
              isDuplicate ? 'Duplikat existiert bereits' : ''
            ].filter(e => e)
          };
        });

        setCsvPreview(preview);
        setCsvFile(file);
      } catch (err) {
        showToast('CSV-Fehler: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  };

  const doImport = () => {
    if (!csvPreview) return;

    const validRows = csvPreview.filter(r => r.valid);
    if (validRows.length === 0) {
      showToast('Keine gültigen Zeilen zum Importieren', 'error');
      return;
    }

    // Im Produktiv-Modus müsste der Import über die Supabase-DB laufen (Bulk-Insert).
    // Das ist noch nicht implementiert → deutlicher Hinweis statt stiller Demo-Insert.
    if (window.KRS_MODE === 'produktiv') {
      showToast('CSV-Import ist im Live-Modus noch nicht aktiv — bitte Schüler direkt in Supabase einspielen', 'error');
      return;
    }

    setImporting(true);

    setTimeout(() => {
      validRows.forEach(row => {
        const code = generateAnmeldeCode(row.klasse);
        mockSchueler.push({
          code,
          vorname: row.vorname,
          nachname: row.nachname,
          klasse: row.klasse.toLowerCase(),
          klassenstufe: parseInt(String(row.klasse).match(/^\d+/)?.[0] || '0', 10),
          hat_gewaehlt: false,
          zuteilung: null
        });
      });

      showToast(`${validRows.length} Schüler erfolgreich importiert!`, 'success');
      setCsvPreview(null);
      setCsvFile(null);
      setImporting(false);
    }, 500);
  };

  // =====================================================================
  // Serienbriefe drucken — erzeugt pro Schüler eine Brief-Seite mit
  // persönlichem Anmeldecode und öffnet direkt den Druck-Dialog.
  //
  // scope:
  //   'selection'  → nur aktuelle Checkbox-Auswahl (auch wenn gefiltert)
  //   'visible'    → aktuell sichtbar gefilterte Liste (Default)
  //   'all'        → immer alle Schüler, Filter ignorieren
  //
  // Wichtig für den Anwendungsfall „Code verloren": der User filtert nach
  // Klasse oder sucht den Schüler, hakt ihn an, und druckt nur die Auswahl.
  // =====================================================================
  const printSerienbriefe = async (scope = 'visible', overrideList = null) => {
    let list;
    if (Array.isArray(overrideList)) {
      list = overrideList;
    } else if (scope === 'selection') {
      list = mockSchueler.filter(s => selectedCodes.has(s.code));
    } else if (scope === 'all') {
      list = mockSchueler;
    } else {
      list = (gefiltert && gefiltert.length > 0) ? gefiltert : mockSchueler;
    }
    if (!list || list.length === 0) {
      showToast('Keine Schüler zum Drucken vorhanden.', 'error');
      return;
    }

    const heute = new Date().toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });
    const frontendUrl = (window.KRS_SUPABASE && window.KRS_SUPABASE.schueler_url)
      || 'https://kurpfalz-realschule.github.io/krs-projektwahl-2026/schueler.html';

    // v39: Pro Schüler einen QR-Code erzeugen — öffnet die Anmeldeseite mit
    // vorausgefülltem Code (?code=…). Clientseitig via esm.sh/qrcode, kein
    // externer QR-Dienst (Datenschutz). Graceful Degradation: ohne Lib → ohne QR.
    let qrFor = () => '';
    try {
      const QRMod = await import('https://esm.sh/qrcode@1.5.4');
      const toDataURL = QRMod.toDataURL || (QRMod.default && QRMod.default.toDataURL);
      if (typeof toDataURL === 'function') {
        const qrMap = {};
        for (const s of list) {
          qrMap[s.code] = await toDataURL(
            frontendUrl + '?code=' + encodeURIComponent(s.code),
            { width: 240, margin: 1, errorCorrectionLevel: 'M' }
          );
        }
        qrFor = (code) => qrMap[code] || '';
      }
    } catch (e) {
      console.warn('[KRS] QR-Code-Generierung nicht verfügbar:', e);

function ProjekteView({ setModal, refreshKey, loadAll }) {
  const [editingId, setEditingId] = useState(null);
  const [formData, setFormData] = useState(null);
  // Stale-Closure-Fix: Das Modal (inkl. Speichern-Handler) wird im useEffect
  // gebaut und per setModal() im State gehalten. Der Handler schließt damit über
  // den formData-Stand zum BAU-Zeitpunkt. Bei schnellen Eingaben (Stepper, selects)
  // kann der im DOM hängende Speichern-Klick ein veraltetes formData lesen →
  // fälschlich "Titel und Lehrer sind erforderlich", obwohl die Felder sichtbar
  // gefüllt sind. Eine Ref hält immer den AKTUELLEN Stand; der Handler liest daraus.
  const formDataRef = useRef(null);
  formDataRef.current = formData;
  // v27: localKey erzwingt useMemo-Neuberechnung nach Demo-Mode-Mutationen
  const [localKey, setLocalKey] = useState(0);
  const projekte = useMemo(() => [...mockProjekteData], [refreshKey, localKey]);
  const entwurfsCount = useMemo(() => projekte.filter(p => p.status === 'entwurf').length, [projekte]);

  const closeModal = () => {
    setModal(null);
    setFormData(null);
    setEditingId(null);
  };

  const openCreateModal = () => {
    setFormData({
      id: 'p' + (mockProjekteData.length + 1),
      titel: '',
      kurzbeschreibung: '',
      lehrer_id: '',
      lehrer2_id: '',
      max_plaetze: 12,
      min_teilnehmer: 6,
      min_klasse: 5,
      max_klasse: 9,
      status: 'entwurf'
    });
    setEditingId('new');
  };

  const openEditModal = (projekt) => {
    setFormData({...projekt, lehrer2_id: projekt.lehrer2_id || ''});
    setEditingId(projekt.id);
  };

  // v19: Modal bei jedem formData-Wechsel neu in den globalen Modal-Slot schreiben,
  // damit der Prefill zieht UND Live-Eingaben reflected werden (controlled inputs).
  // Alter Bug: showModal() wurde synchron nach setFormData() gerufen und las im
  // Closure das stale formData → Maske blieb leer.
  useEffect(() => {
    if (!formData || !editingId) { setModal(null); return; }
    const lehrerChoices = mockLehrerData.filter(l => l.rolle === 'projektlehrer' || l.rolle === 'super_admin');
    const teacherCount = getProjektTeacherCount(formData);
    const maxPlaetzeLimit = getProjektMaxPlaetzeLimit(formData);
    const plaetzeRichtwert = getProjektPlaetzeRichtwert(formData);
    const currentMaxPlaetze = parseIntOr(formData.max_plaetze, PROJECT_CAPACITY_PER_TEACHER);
    setModal(html`
      <div class="modal-overlay" onClick=${closeModal}>
        <div class="modal-content" onClick=${e => e.stopPropagation()}>
          <button class="modal-close" onClick=${closeModal} aria-label="Schließen" title="Schließen (ESC)">×</button>
          <h2>${editingId === 'new' ? '➕ Neues Projekt' : '✏️ Projekt bearbeiten'}</h2>
          <div class="input-group">
            <label>Titel *</label>
            <input type="text" value=${formData?.titel || ''} onInput=${e => setFormData({...formData, titel: e.target.value})} />
          </div>
          <div class="input-group">
            <label>Kurzbeschreibung *</label>
            <textarea maxlength="300" value=${formData?.kurzbeschreibung || ''} onInput=${e => setFormData({...formData, kurzbeschreibung: e.target.value})}></textarea>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label>Lehrer 1 *</label>
              <select data-testid="projekt-lehrer1-select" value=${formData?.lehrer_id || ''} onChange=${e => {
                const selected = e.target.value;
                setFormData(prev => {
                  const next = { ...(prev || formData), lehrer_id: selected };
                  if (next.lehrer2_id === next.lehrer_id) next.lehrer2_id = '';
                  return normalizeProjektCapacity(next);
                });
              }}>
                <option value="">Wählen...</option>
                ${lehrerChoices.map(l => html`
                  <option value=${l.id}>${l.name}</option>
                `)}
              </select>
            </div>
            <div class="input-group">
              <label>Lehrer 2 (optional)</label>
              <select data-testid="projekt-lehrer2-select" value=${formData?.lehrer2_id || ''} onChange=${e => {
                const selected = e.target.value;
                setFormData(prev => {
                  const base = prev || formData;
                  const hadSecond = !!base.lehrer2_id;
                  const next = { ...base, lehrer2_id: selected };
                  return normalizeProjektCapacity(next, { expandForSecondTeacher: !hadSecond && !!selected });
                });
              }}>
                <option value="">Kein zweiter Lehrer</option>
                ${lehrerChoices.filter(l => l.id !== formData?.lehrer_id).map(l => html`
                  <option value=${l.id}>${l.name}</option>
                `)}
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label>Status</label>
              <select value=${formData?.status || 'entwurf'} onChange=${e => setFormData({...formData, status: e.target.value})}>
                <option value="entwurf">Entwurf</option>
                <option value="veroeffentlicht">Veröffentlicht</option>
              </select>
            </div>
            ${renderNumberStepper({
              label: 'Max. Plätze',
              value: formData?.max_plaetze,
              min: 1,
              max: maxPlaetzeLimit,
              testId: 'projekt-max-plaetze-control',
              hint: `Richtwert: ${teacherCount} x ${PROJECT_CAPACITY_PER_TEACHER} = ${plaetzeRichtwert} Plätze — frei wählbar bis ${PROJECT_CAPACITY_HARD_MAX}`,
              onChange: value => {
                setFormData(prev => {
                  const next = { ...(prev || formData), max_plaetze: value };
                  return next;
                });
              }
            })}
          </div>
          <div class="form-row">
            ${renderNumberStepper({
              label: 'Min. Teilnehmer',
              value: formData?.min_teilnehmer,
              min: 1,
              max: maxPlaetzeLimit,
              testId: 'projekt-min-teilnehmer-control',
              onChange: value => setFormData(prev => ({ ...(prev || formData), min_teilnehmer: value }))
            })}
            <div class="input-group">
              <label>Kapazitätsregel</label>
              <div style="padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-subtle);font-size:13px;color:var(--text-muted);min-height:40px;">
                Richtwert: 12 Plätze pro Lehrkraft (24 mit zwei Lehrkräften). Die Plätze sind frei wählbar, z.&nbsp;B. für feste Klassenprojekte mit mehr Schülern.
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label>Min. Klassenstufe</label>
              <select value=${formData?.min_klasse || 5} onChange=${e => setFormData({...formData, min_klasse: parseInt(e.target.value)})}>
                ${PROJECT_GRADE_OPTIONS.map(k => html`<option value=${k}>${k}</option>`)}
              </select>
            </div>
            <div class="input-group">
              <label>Max. Klassenstufe</label>
              <select value=${formData?.max_klasse || 9} onChange=${e => setFormData({...formData, max_klasse: parseInt(e.target.value)})}>
                ${PROJECT_GRADE_OPTIONS.map(k => html`<option value=${k}>${k}</option>`)}
              </select>
            </div>
          </div>
          <!-- v24: Projekt-Bild -->
          <div class="input-group" style="margin-top:10px;">
            <label>Projekt-Bild (optional, max. 5 MB)</label>
            ${editingId === 'new' ? html`
              <div style="padding:10px;background:#FAFBFC;border:1px dashed #D0D7DE;border-radius:6px;color:#6C7A87;font-size:0.85rem;">
                💡 Speichere das Projekt zuerst — danach kannst du ein Bild hochladen.
              </div>
            ` : html`
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                ${formData?.bild_url ? html`
                  <img src=${formData.bild_url} alt="Projekt-Bild"
                    style="width:120px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #D0D7DE;" />
                ` : html`
                  <div style="width:120px;height:80px;display:flex;align-items:center;justify-content:center;background:#F6F7F9;border:1px dashed #D0D7DE;border-radius:6px;color:#8B97A2;font-size:0.8rem;">Kein Bild</div>
                `}
                <div style="display:flex;flex-direction:column;gap:6px;">
                  <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" id="projektBildInput" style="display:none;"
                    onChange=${async (e) => {
                      const file = e.target.files && e.target.files[0];
                      if (!file) return;
                      if (file.size > 5 * 1024 * 1024) { showToast('Bild ist größer als 5 MB.', 'error'); return; }
                      try {
                        showToast('Bild wird hochgeladen…', 'info');
                        const svc = new window.KrsDataService();
                        const { url } = await svc.uploadProjektBild(editingId, file);
                        setFormData({...formData, bild_url: url});
                        if (typeof loadAll === 'function') await loadAll();
                        showToast('Bild hochgeladen ✓', 'success');
                      } catch (err) {
                        showToast('Fehler: ' + err.message, 'error');
                      } finally {
                        e.target.value = '';
                      }
                    }} />
                  <button type="button" class="btn btn-ghost" style="padding:6px 12px;font-size:0.85rem;"
                    onClick=${() => document.getElementById('projektBildInput')?.click()}>
                    ${formData?.bild_url ? '🔄 Bild ersetzen' : '📷 Bild hochladen'}
                  </button>
                  ${formData?.bild_url ? html`
                    <button type="button" class="btn btn-danger" style="padding:6px 12px;font-size:0.85rem;"
                      onClick=${async () => {
                        if (!window.confirm('Bild wirklich entfernen?')) return;
                        try {
                          const svc = new window.KrsDataService();
                          await svc.deleteProjektBild(editingId);
                          setFormData({...formData, bild_url: null});
                          if (typeof loadAll === 'function') await loadAll();
                          showToast('Bild entfernt', 'success');
                        } catch (err) {
                          showToast('Fehler: ' + err.message, 'error');
                        }
                      }}>🗑 Entfernen</button>
                  ` : ''}
                </div>
              </div>
            `}
          </div>
          <div class="btn-group" style="margin-top:20px;">
            <button class="btn btn-ghost" onClick=${() => { setModal(null); setFormData(null); setEditingId(null); }}>Abbrechen</button>
            ${editingId !== 'new' && html`
              <button class="btn btn-danger" onClick=${async () => {
                const titel = formData?.titel || 'dieses Projekt';
                if (!window.confirm(`Projekt "${titel}" wirklich löschen?\n\nDiese Aktion kann nicht rückgängig gemacht werden.`)) return;
                try {
                  if (window.KRS_MODE === 'produktiv') {
                    await (new window.KrsDataService()).deleteProjekt(editingId);
                  } else {
                    const i = mockProjekteData.findIndex(p => p.id === editingId);
                    if (i !== -1) mockProjekteData.splice(i, 1);
                    setLocalKey(k => k + 1); // v27: Re-Render erzwingen
                  }
                  // v22: nach DB-Write in Produktiv-Modus zentralen loadAll() triggern,
                  // damit mockProjekteData aktualisiert und die View neu gerendert wird.
                  // Realtime-Subscription ist Fallback, loadAll() ist synchroner Pfad.
                  if (typeof loadAll === 'function') await loadAll();
                  showToast('Projekt gelöscht', 'success');
                } catch (err) {
                  showToast('Fehler: ' + err.message, 'error');
                  return;
                }
                setModal(null);
                setFormData(null);
                setEditingId(null);
              }}>Löschen</button>
            `}
            <button class="btn btn-success" onClick=${async () => {
              // Immer den aktuellen Stand aus der Ref lesen (siehe Stale-Closure-Fix oben).
              const cleanedForm = { ...(formDataRef.current || formData || {}) };
              if (cleanedForm.lehrer2_id && cleanedForm.lehrer2_id === cleanedForm.lehrer_id) cleanedForm.lehrer2_id = '';
              const minTeilnehmer = parseIntOr(cleanedForm.min_teilnehmer, 0);
              const maxPlaetze = parseIntOr(cleanedForm.max_plaetze, 0);
              if (!cleanedForm.titel || !cleanedForm.lehrer_id) {
                showToast('Titel und Lehrer sind erforderlich', 'error');
                return;
              }
              // Bugfix: kurzbeschreibung ist NOT NULL in der DB — leerer Wert würde
              // sonst den Insert/Update mit "violates not-null constraint" scheitern lassen.
              if (!(cleanedForm.kurzbeschreibung || '').trim()) {
                showToast('Kurzbeschreibung ist erforderlich', 'error');
                return;
              }
              if ((cleanedForm.kurzbeschreibung || '').length > 300) {
                showToast('Kurzbeschreibung darf max. 300 Zeichen haben', 'error');
                return;
              }
              if (cleanedForm.lehrer2_id && cleanedForm.lehrer2_id === cleanedForm.lehrer_id) {
                showToast('Lehrer 1 und Lehrer 2 müssen unterschiedlich sein', 'error');
                return;
              }
              if (maxPlaetze < minTeilnehmer) {
                showToast('Max. Plätze müssen >= Min. Teilnehmer sein', 'error');
                return;
              }
              // v36: 12/24 ist nur noch Richtwert — hartes Limit nur Plausibilitätsgrenze.
              if (maxPlaetze > PROJECT_CAPACITY_HARD_MAX) {
                showToast('Zu viele Plätze: max. ' + PROJECT_CAPACITY_HARD_MAX + '.', 'error');
                return;
              }
              try {
                if (window.KRS_MODE === 'produktiv') {
                  const svc = new window.KrsDataService();
                  // Payload bereinigen: keine Hilfs-Felder mitschicken
                  const payload = {
                    titel: cleanedForm.titel,
                    lehrer_id: cleanedForm.lehrer_id,
                    lehrer2_id: cleanedForm.lehrer2_id || null,
                    ort: cleanedForm.ort || null,
                    // Bugfix: leerer String statt null — DB-Spalte ist NOT NULL.
                    // Form-Validation oben fängt leere Werte bereits ab; das hier ist
                    // ein defensives Safety-Net falls Validation umgangen würde.
                    kurzbeschreibung: (cleanedForm.kurzbeschreibung || '').trim(),
                    min_teilnehmer: minTeilnehmer,
                    max_plaetze: maxPlaetze,
                    min_klasse: cleanedForm.min_klasse ?? 5,
                    max_klasse: cleanedForm.max_klasse ?? 9,
                    status: cleanedForm.status || 'entwurf',
                  };
                  if (editingId === 'new') {
                    await svc.createProjekt(payload);
                    showToast('Projekt erstellt!', 'success');
                  } else {
                    await svc.updateProjekt(editingId, payload);
                    showToast('Projekt aktualisiert!', 'success');
                  }
                } else {
                  const savedForm = {
                    ...cleanedForm,
                    lehrer2_id: cleanedForm.lehrer2_id || null,
                    min_teilnehmer: minTeilnehmer,
                    max_plaetze: maxPlaetze,
                    status: cleanedForm.status || 'entwurf',
                  };
                  if (editingId === 'new') {
                    mockProjekteData.push(savedForm);
                    showToast('Projekt erstellt!', 'success');
                  } else {
                    const idx = mockProjekteData.findIndex(p => p.id === editingId);
                    if (idx >= 0) mockProjekteData[idx] = savedForm;
                    showToast('Projekt aktualisiert!', 'success');
                  }
                  setLocalKey(k => k + 1); // v27: Re-Render erzwingen
                }
                // v22: nach DB-Write in Produktiv-Modus zentralen loadAll() triggern,
                // damit mockProjekteData synchron aktualisiert wird (Realtime ist nur Fallback).
                if (window.KRS_MODE === 'produktiv' && typeof loadAll === 'function') await loadAll();
              } catch (err) {
                showToast('Fehler: ' + err.message, 'error');
                return;
              }
              setModal(null);
              setFormData(null);
              setEditingId(null);
            }}>Speichern</button>
          </div>
        </div>
      </div>
    `);
  }, [formData, editingId]);

  // v25: Bulk-Aktion — alle Entwürfe in einem Schwung veröffentlichen
  // (entwurfsCount wird oben via useMemo aus projekte berechnet)
  const handleBulkVeroeffentlichen = async () => {
    const entwuerfe = mockProjekteData.filter(p => p.status === 'entwurf');
    if (!entwuerfe.length) { showToast('Keine Entwürfe zu veröffentlichen.', 'info'); return; }
    if (!window.confirm(entwuerfe.length + ' Entwurf-Projekte veröffentlichen?')) return;
    let ok = 0, fehler = 0;
    try {
      if (window.KRS_MODE === 'produktiv') {
        const svc = new window.KrsDataService();
        for (const p of entwuerfe) {
          try { await svc.updateProjekt(p.id, { status: 'veroeffentlicht' }); ok++; }
          catch (err) { console.warn('[bulk-veröffentlichen]', p.id, err); fehler++; }
        }
        if (typeof loadAll === 'function') await loadAll();
      } else {
        entwuerfe.forEach(p => { p.status = 'veroeffentlicht'; ok++; });
        setLocalKey(k => k + 1); // v27: Re-Render erzwingen
      }
      if (fehler === 0) showToast(ok + ' Projekte veröffentlicht ✓', 'success');
      else showToast(ok + ' veröffentlicht, ' + fehler + ' Fehler — Konsole prüfen.', 'error');
    } catch (err) {
      showToast('Bulk-Aktion fehlgeschlagen: ' + err.message, 'error');
    }
  };

  // v25: Inline-Status-Toggle pro Zeile (ohne Modal-Öffnen)
  const handleStatusToggle = async (p) => {
    const newStatus = p.status === 'veroeffentlicht' ? 'entwurf' : 'veroeffentlicht';
    if (!window.confirm('Status von „' + (p.titel || 'Projekt') + '" auf „' + newStatus + '" setzen?')) return;
    try {
      if (window.KRS_MODE === 'produktiv') {
        await (new window.KrsDataService()).updateProjekt(p.id, { status: newStatus });
        if (typeof loadAll === 'function') await loadAll();
      } else {
        p.status = newStatus;
        setLocalKey(k => k + 1); // v27: Re-Render erzwingen
      }
      showToast('Status: ' + newStatus, 'success');
    } catch (err) {
      showToast('Fehler: ' + err.message, 'error');
    }
  };

  return html`
    <div class="main-header">
      <div>
        <h1 class="main-title">Projekte</h1>
        <div class="main-subtitle">${projekte.length} Projekte angelegt${entwurfsCount ? ' · ' + entwurfsCount + ' Entwürfe' : ''}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${entwurfsCount > 0 ? html`
          <button class="btn btn-secondary" onClick=${handleBulkVeroeffentlichen}
                  title='Alle Projekte mit Status „entwurf" auf „veröffentlicht" setzen'>
            📢 Alle Entwürfe veröffentlichen (${entwurfsCount})
          </button>
        ` : ''}
        <button class="btn btn-primary" onClick=${openCreateModal}>➕ Neues Projekt</button>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width:64px;">Bild</th>
            <th>Titel</th>
            <th>Lehrer</th>
            <th>Plätze</th>
            <th>Klassenstufen</th>
            <th>Wünsche (1./2./3.)</th>
            <th>Status</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody>
          ${projekte.length === 0 ? html`
            <tr><td colspan="8">
              <div class="empty-state">
                <span class="empty-emoji">📋</span>
                <div class="empty-title">Noch keine Projekte angelegt</div>
                <div class="empty-hint">Klicke oben auf "➕ Neues Projekt", um das erste Projekt anzulegen.</div>
              </div>
            </td></tr>
          ` : projekte.map(p => {
            const belegt = p.belegt ?? 0;
            const ausgelastet = belegt >= p.max_plaetze;
            const ueberbucht = (p.erstwahl_wuensche ?? 0) > p.max_plaetze;
            const lehrerNamen = getProjektLehrerNames(p).join(', ') || '—';
            return html`
              <tr key=${p.id}>
                <td>
                  ${p.bild_url ? html`
                    <img src=${p.bild_url} alt="" style="width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--border-color, #D0D7DE);" />
                  ` : html`
                    <div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#F6F7F9;border-radius:4px;border:1px dashed #D0D7DE;color:#8B97A2;font-size:1.1rem;">📷</div>
                `}
                </td>
                <td><strong>${p.titel}</strong><br/><small style="color:var(--text-muted);">${p.kurzbeschreibung}</small></td>
                <td>${lehrerNamen}</td>
                <td>
                  ${belegt}/${p.max_plaetze}
                  ${ausgelastet ? html`<span class="pill pill-success" style="margin-left:4px;">voll</span>` : ''}
                </td>
                <td>${p.min_klasse}-${p.max_klasse}</td>
                <td>
                  <span class="pill pill-wahl-1">${p.erstwahl_wuensche}</span>
                  <span class="pill pill-wahl-2">${p.zweitwahl_wuensche}</span>
                  <span class="pill pill-wahl-3">${p.drittwahl_wuensche}</span>
                  ${ueberbucht ? html`<br/><small style="color:var(--krs-orange);">⚠️ überbucht</small>` : ''}
                </td>
                <td>
                  <span class=${"pill " + (p.status === 'veroeffentlicht' ? 'pill-success' : 'pill-info')}
                        style="cursor:pointer;user-select:none;"
                        title=${"Klicken: Status umschalten — aktuell „" + (p.status || 'entwurf') + "\""}
                        onClick=${(e) => { e.stopPropagation(); handleStatusToggle(p); }}>
                    ${p.status || 'entwurf'} ${p.status === 'veroeffentlicht' ? '✓' : '↻'}
                  </span>
                </td>
                <td class="actions-cell">
                  <button class="btn btn-ghost btn-small" onClick=${() => openEditModal(p)}>✏️ Bearbeiten</button>
                </td>
              </tr>
            `;
          })}
        </tbody>
      </table>
    </div>
  `;
}

// === MEIN PROJEKT (Projektlehrer-Self-Service, v25) ===
// Reduzierte Edit-Maske für Rolle 'projektlehrer'. Backend-Trigger
// (enforce_projektlehrer_whitelist) erzwingt Spalten-Whitelist serverseitig —
// hier im Frontend bilden wir das ab, damit die UX sauber bleibt.
//
// Eigene Projekte = Projekte, bei denen man als Lehrer 1 oder Lehrer 2 zugeordnet ist.
// Anlegen nur in setup/anmeldung-Phase. Trigger erzwingt status='entwurf'.
function ProjektLehrerView({ setModal, refreshKey, loadAll, phase, currentDbUserId }) {
  const [editingId, setEditingId] = useState(null);
  const [formData, setFormData] = useState(null);

  // Demo-Fallback: wenn kein dbUserId (Demo-Modus), nehmen wir den ersten projektlehrer
  // aus mockLehrerData — damit die View überhaupt etwas anzuzeigen hat.
  const effectiveOwnerId = currentDbUserId
    || (window.KRS_MODE !== 'produktiv'
        ? (mockLehrerData.find(l => l.rolle === 'projektlehrer') || {}).id
        : null);

  const ownProjekte = (mockProjekteData || []).filter(p => isProjektTeacher(p, effectiveOwnerId));

  const canCreate = phase === 'setup' || phase === 'anmeldung';

  const closeModal = () => { setModal(null); setFormData(null); setEditingId(null); };

  const openCreateModal = () => {
    setFormData({
      id: 'p_neu_' + Date.now(),
      titel: '',
      kurzbeschreibung: '',
      langbeschreibung: '',
      ort: '',
      lehrer_id: effectiveOwnerId,
      lehrer2_id: '',
      // Pflichtfelder für Schema; Trigger erzwingt status='entwurf' beim INSERT,
      // egal was wir hier mitgeben. Defaults aus Schema.
      min_teilnehmer: 6,
      max_plaetze: 12,
      min_klasse: 5,
      max_klasse: 9,
      status: 'entwurf',
      bild_url: null,
    });
    setEditingId('new');
  };

  const openEditModal = (projekt) => {
    // Defensive Schicht (RLS + Trigger sind die echte Schutzgrenze, das hier ist UX):
    // Wenn die Liste aus irgendwelchen Gründen ein Fremd-Projekt enthielte,
    // verweigern wir das Öffnen client-seitig und zeigen einen Toast.
    if (effectiveOwnerId && !isProjektTeacher(projekt, effectiveOwnerId)) {
      showToast('Du kannst nur eigene Projekte bearbeiten.', 'error');
      return;
    }
    setFormData({...projekt});
    setEditingId(projekt.id);
  };

  useEffect(() => {
    if (!formData || !editingId) { setModal(null); return; }
    setModal(html`
      <div class="modal-overlay" onClick=${closeModal}>
        <div class="modal-content" onClick=${e => e.stopPropagation()}>
          <button class="modal-close" onClick=${closeModal} aria-label="Schließen" title="Schließen (ESC)">×</button>
          <h2>${editingId === 'new' ? '➕ Neues Projekt anlegen' : '✏️ Projekt bearbeiten'}</h2>
          <p style="color:#6C7A87;font-size:0.85rem;margin:-4px 0 14px;">
            ${editingId === 'new'
              ? 'Dein Entwurf wird gespeichert — die Projektleitung gibt ihn anschließend frei.'
              : 'Du kannst Titel, Beschreibung, Ort und Bild ändern. Plätze, Klassenstufen und Status pflegt die Projektleitung.'}
          </p>
          <div class="input-group">
            <label>Titel *</label>
            <input type="text" value=${formData?.titel || ''}
              onInput=${e => setFormData({...formData, titel: e.target.value})} />
          </div>
          <div class="input-group">
            <label>Kurzbeschreibung *</label>
            <textarea maxlength="300" value=${formData?.kurzbeschreibung || ''}
              onInput=${e => setFormData({...formData, kurzbeschreibung: e.target.value})}></textarea>
            <small style="color:#8B97A2;">max. 300 Zeichen — wird in der Schüler-Übersicht angezeigt.</small>
          </div>
          <div class="input-group">
            <label>Langbeschreibung (optional)</label>
            <textarea value=${formData?.langbeschreibung || ''}
              onInput=${e => setFormData({...formData, langbeschreibung: e.target.value})}></textarea>
          </div>
          <div class="input-group">
            <label>Ort (optional)</label>
            <input type="text" value=${formData?.ort || ''}
              onInput=${e => setFormData({...formData, ort: e.target.value})} />
          </div>
          ${editingId !== 'new' && html`
            <div style="background:#F6F7F9;border-radius:6px;padding:10px 12px;margin-top:10px;font-size:0.85rem;color:#6C7A87;line-height:1.5;">
              <strong style="color:#4A6A83;">Festgelegt von der Projektleitung</strong><br/>
              Leitung: ${getProjektLehrerNames(formData).join(', ') || '—'}<br/>
              Plätze: ${formData?.min_teilnehmer || '?'}–${formData?.max_plaetze || '?'} ·
              Klassen: ${formData?.min_klasse || '?'}–${formData?.max_klasse || '?'} ·
              Status: <strong>${formData?.status || 'entwurf'}</strong>
            </div>
          `}
          <!-- Bild-Upload -->
          <div class="input-group" style="margin-top:14px;">
            <label>Projekt-Bild (optional, max. 5 MB)</label>
            ${editingId === 'new' ? html`
              <div style="padding:10px;background:#FAFBFC;border:1px dashed #D0D7DE;border-radius:6px;color:#6C7A87;font-size:0.85rem;">
                💡 Speichere den Entwurf zuerst — danach kannst du ein Bild hochladen.
              </div>
            ` : html`
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                ${formData?.bild_url ? html`
                  <img src=${formData.bild_url} alt="Projekt-Bild"
                    style="width:120px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #D0D7DE;" />
                ` : html`
                  <div style="width:120px;height:80px;display:flex;align-items:center;justify-content:center;background:#F6F7F9;border:1px dashed #D0D7DE;border-radius:6px;color:#8B97A2;font-size:0.8rem;">Kein Bild</div>
                `}
                <div style="display:flex;flex-direction:column;gap:6px;">
                  <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" id="projektLehrerBildInput" style="display:none;"
                    onChange=${async (e) => {
                      const file = e.target.files && e.target.files[0];
                      if (!file) return;
                      if (file.size > 5 * 1024 * 1024) { showToast('Bild ist größer als 5 MB.', 'error'); return; }
                      try {
                        showToast('Bild wird hochgeladen…', 'info');
                        const svc = new window.KrsDataService();
                        const { url } = await svc.uploadProjektBild(editingId, file);
                        setFormData({...formData, bild_url: url});
                        if (typeof loadAll === 'function') await loadAll();
                        showToast('Bild hochgeladen ✓', 'success');
                      } catch (err) {
                        showToast('Fehler: ' + err.message, 'error');
                      } finally {
                        e.target.value = '';
                      }
                    }} />
                  <button type="button" class="btn btn-ghost" style="padding:6px 12px;font-size:0.85rem;"
                    onClick=${() => document.getElementById('projektLehrerBildInput')?.click()}>
                    ${formData?.bild_url ? '🔄 Bild ersetzen' : '📷 Bild hochladen'}
                  </button>
                  ${formData?.bild_url ? html`
                    <button type="button" class="btn btn-danger" style="padding:6px 12px;font-size:0.85rem;"
                      onClick=${async () => {
                        if (!window.confirm('Bild wirklich entfernen?')) return;
                        try {
                          const svc = new window.KrsDataService();
                          await svc.deleteProjektBild(editingId);
                          setFormData({...formData, bild_url: null});
                          if (typeof loadAll === 'function') await loadAll();
                          showToast('Bild entfernt', 'success');
                        } catch (err) {
                          showToast('Fehler: ' + err.message, 'error');
                        }
                      }}>🗑 Entfernen</button>
                  ` : ''}
                </div>
              </div>
            `}
          </div>
          <div class="btn-group" style="margin-top:20px;">
            <button class="btn btn-ghost" onClick=${closeModal}>Abbrechen</button>
            <button class="btn btn-success" onClick=${async () => {
              if (!formData.titel || !(formData.kurzbeschreibung || '').trim()) {
                showToast('Titel und Kurzbeschreibung sind erforderlich.', 'error');
                return;
              }
              if ((formData.kurzbeschreibung || '').length > 300) {
                showToast('Kurzbeschreibung darf max. 300 Zeichen lang sein.', 'error');
                return;
              }
              try {
                if (window.KRS_MODE === 'produktiv') {
                  const svc = new window.KrsDataService();
                  if (editingId === 'new') {
                    // Backend-Trigger setzt status='entwurf' & lehrer_id=self.
                    // Wir senden trotzdem konsistente Werte mit, falls der Trigger
                    // (z.B. bei super_admin-Maintenance) nicht greift.
                    const payload = {
                      titel: formData.titel,
                      // Bugfix: leerer String statt null/undefined — DB-Spalte ist NOT NULL.
                      // Stale-Closure bei schnellem Tippen konnte formData.kurzbeschreibung
                      // auf undefined zurücksetzen → NOT NULL constraint violation.
                      kurzbeschreibung: (formData.kurzbeschreibung || '').trim(),
                      langbeschreibung: formData.langbeschreibung || null,
                      ort: formData.ort || null,
                      lehrer_id: effectiveOwnerId,
                      lehrer2_id: null,
                      min_teilnehmer: formData.min_teilnehmer ?? 6,
                      max_plaetze: formData.max_plaetze ?? 12,
                      min_klasse: formData.min_klasse ?? 5,
                      max_klasse: formData.max_klasse ?? 9,
                      status: 'entwurf',
                    };
                    await svc.createProjekt(payload);
                    showToast('Projekt-Entwurf gespeichert!', 'success');
                  } else {
                    // Whitelist: Backend-Trigger blockt alles andere.
                    const payload = {
                      titel: formData.titel,
                      // Bugfix: defensiver Fallback analog createProjekt
                      kurzbeschreibung: (formData.kurzbeschreibung || '').trim(),
                      langbeschreibung: formData.langbeschreibung || null,
                      ort: formData.ort || null,
                    };
                    await svc.updateProjekt(editingId, payload);
                    showToast('Projekt aktualisiert!', 'success');
                  }
                } else {
                  // Demo-Modus: Mock-Array direkt mutieren
                  if (editingId === 'new') {
                    mockProjekteData.push({
                      ...formData,
                      lehrer_id: effectiveOwnerId,
                      lehrer2_id: '',
                      status: 'entwurf',
                    });
                    showToast('Projekt-Entwurf gespeichert! (Demo)', 'success');
                  } else {
                    const idx = mockProjekteData.findIndex(p => p.id === editingId);
                    if (idx >= 0) {
                      // Whitelist analog Backend
                      mockProjekteData[idx] = {
                        ...mockProjekteData[idx],
                        titel: formData.titel,
                        kurzbeschreibung: (formData.kurzbeschreibung || '').trim(),
                        langbeschreibung: formData.langbeschreibung,
                        ort: formData.ort,
                        bild_url: formData.bild_url,
                      };
                    }
                    showToast('Projekt aktualisiert! (Demo)', 'success');
                  }
                }
                if (window.KRS_MODE === 'produktiv' && typeof loadAll === 'function') await loadAll();
              } catch (err) {
                showToast('Fehler: ' + err.message, 'error');
                return;
              }
              closeModal();
            }}>Speichern</button>
          </div>
        </div>
      </div>
    `);
  }, [formData, editingId]);

  return html`
    <div class="main-header">
      <div>
        <h1 class="main-title">📚 Mein Projekt</h1>
        <div class="main-subtitle">${ownProjekte.length === 1 ? '1 eigenes Projekt' : ownProjekte.length + ' eigene Projekte'}</div>
      </div>
      ${canCreate ? html`<button class="btn btn-primary" onClick=${openCreateModal}>➕ Neues Projekt</button>` : ''}
    </div>

    ${ownProjekte.length === 0 ? html`
      <div class="empty-state" style="padding:40px;text-align:center;">
        <span class="empty-emoji" style="font-size:2.5rem;">📚</span>
        <div class="empty-title" style="font-weight:600;margin-top:8px;">Du hast noch kein Projekt angelegt</div>
        <div class="empty-hint" style="color:#6C7A87;margin-top:4px;">${canCreate
          ? 'Klicke oben auf „➕ Neues Projekt", um deinen Entwurf anzulegen.'
          : 'In der aktuellen Phase können keine neuen Projekte mehr angelegt werden. Sprich mit der Projektleitung, falls du noch eines brauchst.'}</div>
      </div>
    ` : html`
      <div data-section="mein-projekt-cards"
           style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:8px;">
        ${ownProjekte.map(p => html`
          <div class="card" style="padding:14px;border:1px solid #D0D7DE;border-radius:8px;background:#fff;">
            ${p.bild_url
              ? html`<img src=${p.bild_url} alt="" style="width:100%;height:140px;object-fit:cover;border-radius:6px;margin-bottom:10px;" />`
              : html`<div style="width:100%;height:140px;display:flex;align-items:center;justify-content:center;background:#F6F7F9;border-radius:6px;margin-bottom:10px;color:#8B97A2;font-size:1.5rem;">📷</div>`}
            <h3 style="margin:0 0 4px;font-size:1.05rem;line-height:1.3;">${p.titel || '(ohne Titel)'}</h3>
            <p style="margin:0 0 10px;color:#6C7A87;font-size:0.85rem;min-height:34px;">${p.kurzbeschreibung || ''}</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:0.75rem;color:#6C7A87;align-items:center;">
              <span class=${"pill " + (p.status === 'veroeffentlicht' ? 'pill-success' : 'pill-info')}>${p.status || 'entwurf'}</span>
              ${p.ort ? html`<span>📍 ${p.ort}</span>` : ''}
              <span>Leitung: ${getProjektLehrerNames(p).join(', ') || '—'}</span>
              <span>👥 ${p.min_teilnehmer || '?'}–${p.max_plaetze || '?'}</span>
              <span>🎓 ${p.min_klasse || '?'}–${p.max_klasse || '?'}</span>
            </div>
            <button class="btn btn-ghost btn-small" style="margin-top:12px;width:100%;" onClick=${() => openEditModal(p)}>✏️ Bearbeiten</button>
          </div>
        `)}
      </div>
    `}
  `;
}

// === MEINE KLASSE (Klassenlehrer-Übersicht, v27/E1 + v28/E1.5) ===
// E1: Read-Only-View für Rolle 'klassenlehrer', filtert nach klassenlehrer_von.
// E1.5: Zuteilung-Spalte editierbar — Dropdown listet veröffentlichte Projekte
// gefiltert auf die Klassenstufe der Klasse. Setzt s.zuteilung (Projekt-ID) und
// s.hat_gewaehlt zentral via service.klassenlehrerAssignSchueler — Demo mutiert
// in-memory, Live ruft RPC mit RLS-Klassencheck.
function KlassenlehrerView({ refreshKey, currentDbUserId }) {
  const service = useMemo(() => new window.KrsDataService(), []);
  const [localKey, setLocalKey] = useState(0);
  const [busyCode, setBusyCode] = useState(null);

  const effectiveOwnerId = currentDbUserId
    || (window.KRS_MODE !== 'produktiv'
        ? (mockLehrerData.find(l => l.rolle === 'klassenlehrer') || {}).id
        : null);

  const lehrer = useMemo(
    () => (mockLehrerData || []).find(l => l.id === effectiveOwnerId) || null,
    [refreshKey, localKey, effectiveOwnerId]
  );
  const klasse = lehrer?.klassenlehrer_von || '';

  const schueler = useMemo(() => {
    if (!klasse) return [];
    const k = String(klasse).toLowerCase();
    return (mockSchueler || []).filter(s => String(s.klasse || '').toLowerCase() === k)
      .sort((a, b) => String(a.nachname || '').localeCompare(String(b.nachname || ''), 'de'));
  }, [refreshKey, localKey, klasse]);

  // Klassenstufe aus dem ersten Schüler ableiten — alle Schüler einer Klasse
  // haben dieselbe klassenstufe. Fallback: aus Klassen-Namen parsen ("7a" → 7).
  const klassenstufe = useMemo(() => {
    if (schueler.length > 0 && schueler[0].klassenstufe) return schueler[0].klassenstufe;
    const m = String(klasse || '').match(/^(\d+)/);
    return m ? parseInt(m[1], 10) : null;
  }, [schueler, klasse]);

  // Dropdown-Optionen: nur veröffentlichte Projekte, passende Klassenstufe.
  const verfuegbareProjekte = useMemo(() => {
    return (mockProjekteData || [])
      .filter(p => p.status === 'veroeffentlicht')
      .filter(p => {
        if (klassenstufe == null) return true;
        const minOk = p.min_klasse == null || klassenstufe >= p.min_klasse;
        const maxOk = p.max_klasse == null || klassenstufe <= p.max_klasse;
        return minOk && maxOk;
      })
      .sort((a, b) => String(a.titel || '').localeCompare(String(b.titel || ''), 'de'));
  }, [refreshKey, localKey, klassenstufe]);

  const angemeldet = schueler.filter(s => s.hat_gewaehlt).length;
  const offen = schueler.length - angemeldet;
  const prozent = schueler.length > 0 ? Math.round((angemeldet / schueler.length) * 100) : 0;

  if (!lehrer) {
    return html`<div class="card"><div class="empty-state" style="padding:1rem;">Kein Klassenlehrer-Profil gefunden.</div></div>`;
  }
  if (!klasse) {
    return html`
      <div class="main-header">
        <h1 class="main-title">Meine Klasse</h1>
      </div>
      <div class="card"><div class="empty-state" style="padding:1rem;">
        Für deinen Account ist keine Klasse hinterlegt. Die Projektleitung kann das im Lehrer-Bereich nachtragen (Feld "Klassenlehrer von").
      </div></div>
    `;
  }

  // Defensiv: zuteilung kann historisch sowohl Projekt-ID (KlassenlehrerView /
  // E1.5) als auch Projekt-Titel (UmbuchungView pre-existing) sein.
  const projektTitel = (idOrTitle) => {
    if (!idOrTitle) return null;
    const p = (mockProjekteData || []).find(x => x.id === idOrTitle || x.titel === idOrTitle);
    return p ? p.titel : null;
  };

  // Für das select brauchen wir den ID-Wert. Wenn s.zuteilung ein Titel ist,
  // resolven wir auf die ID, damit die Auswahl im Dropdown markiert wird.
  const zuteilungId = (val) => {
    if (!val) return '';
    const p = (mockProjekteData || []).find(x => x.id === val || x.titel === val);
    return p ? p.id : '';
  };

  const onAssign = async (code, neueProjektId) => {
    setBusyCode(code);
    try {
      const r = await service.klassenlehrerAssignSchueler({ code, projektId: neueProjektId || null });
      if (r && r.success === false) {
        showToast('Fehler: ' + (r.error || 'unbekannt'), 'error');
        return;
      }
      setLocalKey(k => k + 1);
      const s = (mockSchueler || []).find(x => x.code === code);
      const name = s ? `${s.vorname} ${s.nachname}` : code;
      if (neueProjektId) {
        const titel = projektTitel(neueProjektId);
        showToast(`${name} wurde „${titel}" zugewiesen`, 'success');
      } else {
        showToast(`${name}: Zuteilung entfernt`, 'success');
      }
    } catch (err) {
      showToast('Fehler: ' + (err.message || err), 'error');
    } finally {
      setBusyCode(null);
    }
  };

  // E1.6: Erinnerungs-Trigger — öffnet eine druckbare Liste mit den offenen
  // Schülern (Vorname, Nachname, Code, Anmelde-URL). Klassenlehrer kann das
  // ausdrucken und in der Klasse austeilen oder an die Tafel hängen.
  // Schüler haben keine eigenen E-Mail-Adressen → Mailto-BCC ist nicht möglich.
  const offeneSchueler = useMemo(
    () => schueler.filter(s => !s.hat_gewaehlt && !s.zuteilung),
    [schueler]
  );
  const handleErinnerung = () => {
    if (offeneSchueler.length === 0) {
      showToast('Keine offenen Schüler — alle haben bereits gewählt oder sind zugewiesen.', 'success');
      return;
    }
    const heute = new Date().toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });
    const url = (window.KRS_SUPABASE && window.KRS_SUPABASE.schueler_url)
      || 'https://kurpfalz-realschule.github.io/krs-projektwahl-2026/schueler.html';
    const klasseUC = (klasse || '').toUpperCase();
    const w = window.open('', '_blank', 'width=820,height=1100');
    if (!w) {
      showToast('Bitte Popup-Blocker erlauben — Druckansicht konnte nicht geöffnet werden.', 'error');
      return;
    }
    const rows = offeneSchueler.map(s => `
      <tr>
        <td>${htmlEscape(s.vorname)} ${htmlEscape(s.nachname)}</td>
        <td><code>${htmlEscape(s.code)}</code></td>
        <td>${htmlEscape(url)}</td>
      </tr>
    `).join('');
    w.document.write(`<!doctype html>
<html lang="de"><head><meta charset="utf-8" />
<title>Erinnerung Projektwoche – Klasse ${htmlEscape(klasseUC)}</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; padding: 24pt; color: #111; }
  h1 { font-size: 18pt; margin: 0 0 4pt; }
  .meta { color: #555; font-size: 11pt; margin-bottom: 16pt; }
  table { width: 100%; border-collapse: collapse; font-size: 11pt; }
  th, td { padding: 6pt 8pt; text-align: left; border-bottom: 1px solid #ccc; vertical-align: top; }
  th { background: #f5f5f5; font-weight: 600; }
  code { font-family: ui-monospace, Menlo, monospace; background: #f0f0f0; padding: 1pt 4pt; border-radius: 3pt; }
  .note { margin-top: 18pt; font-size: 10pt; color: #555; line-height: 1.5; }
  @media print { body { padding: 12mm; } .no-print { display: none; } }
</style>
</head><body>
<h1>Erinnerung Projektwoche-Anmeldung</h1>
<div class="meta">Klasse <strong>${htmlEscape(klasseUC)}</strong> · ${htmlEscape(heute)} · ${offeneSchueler.length} offene Schüler:innen</div>
<table>
  <thead><tr><th>Name</th><th>Anmelde-Code</th><th>Anmelde-Link</th></tr></thead>
  <tbody>${rows}</tbody>
</table>
<p class="note">
  Bitte denkt an eure Anmeldung zur Projektwoche. Geht auf den oben genannten Link,
  gebt euren Anmelde-Code ein und wählt drei Projekte in der Reihenfolge eurer Vorlieben.
</p>
<p class="no-print" style="margin-top:24pt;">
  <button onclick="window.print()" style="padding:8pt 16pt;font-size:12pt;">🖨️ Drucken</button>
</p>
</body></html>`);
    w.document.close();
    showToast(`Druckansicht für ${offeneSchueler.length} offene Schüler geöffnet.`, 'success');
  };

  return html`
    <div class="main-header">
      <div>
        <h1 class="main-title">Meine Klasse — ${klasse.toUpperCase()}</h1>
        <div class="main-subtitle">${angemeldet} von ${schueler.length} angemeldet (${prozent}%) · ${offen} offen</div>
      </div>
      ${offeneSchueler.length > 0 && html`
        <div class="btn-group">
          <button
            class="btn btn-secondary btn-small"
            data-testid="klassenlehrer-erinnerung-btn"
            onClick=${handleErinnerung}
            title="Druckbare Liste der offenen Schüler mit Anmelde-Code">
            📧 Erinnerung an ${offeneSchueler.length} offene Schüler
          </button>
        </div>
      `}
    </div>

    <div class="card">
      <h2>📋 Schüler dieser Klasse</h2>
      <p><small style="color:var(--muted);">Du kannst Schüler ohne Anmeldung direkt einem Projekt zuweisen — die Auswahl ist auf veröffentlichte Projekte für Klassenstufe ${klassenstufe ?? '—'} begrenzt.</small></p>
      ${schueler.length === 0 ? html`
        <div class="empty-state" style="padding:1rem; color:var(--muted);">
          Keine Schüler in Klasse ${klasse.toUpperCase()} gefunden.
        </div>
      ` : html`
        <table data-testid="klassenlehrer-tabelle">
          <thead>
            <tr>
              <th>Code</th>
              <th>Nachname</th>
              <th>Vorname</th>
              <th>Status</th>
              <th>Zuteilung</th>
            </tr>
          </thead>
          <tbody>
            ${schueler.map(s => {
              const selected = zuteilungId(s.zuteilung);
              const isBusy = busyCode === s.code;
              return html`
                <tr key=${s.code} data-testid="klassenlehrer-row" data-status=${s.hat_gewaehlt ? 'angemeldet' : 'offen'}>
                  <td><code>${s.code}</code></td>
                  <td>${s.nachname}</td>
                  <td>${s.vorname}</td>
                  <td>
                    ${s.hat_gewaehlt
                      ? html`<span class="badge badge-success">✓ Angemeldet</span>`
                      : html`<span class="badge">○ Offen</span>`}
                  </td>
                  <td>
                    <select
                      data-testid="klassenlehrer-zuteilung-select"
                      data-code=${s.code}
                      value=${selected}
                      disabled=${isBusy}
                      onChange=${e => onAssign(s.code, e.target.value || null)}
                      style="min-width:220px;"
                    >
                      <option value="">— keine —</option>
                      ${verfuegbareProjekte.map(p => html`
                        <option value=${p.id}>${p.titel}</option>
                      `)}
                    </select>
                  </td>
                </tr>
              `;
            })}
          </tbody>
        </table>
      `}
    </div>
  `;
}

    setModal(html`

                try {
                  if (window.KRS_MODE === 'produktiv') {
                    await (new window.KrsDataService()).deleteUser(editingId);

                  } else {
                    const i = mockLehrerData.findIndex(l => l.id === editingId);
                    if (i !== -1) mockLehrerData.splice(i, 1);
                  }
                  showToast('Lehrer gelöscht', 'success');
                } catch (err) {
                  showToast('Fehler: ' + err.message, 'error');
                  return;
                }
                setModal(null);
                setFormData(null);
                setEditingId(null);
              }}>Löschen</button>
            `}
            <button class="btn btn-success" onClick=${async () => {
              if (!formData.name || !formData.email) {
                showToast('Name und E-Mail sind erforderlich', 'error');
                return;
              }
              try {
                if (window.KRS_MODE === 'produktiv') {
                  const svc = new window.KrsDataService();

                    name: formData.name,
                    email: formData.email,
                    rolle: formData.rolle || 'projektlehrer',
                    klassenlehrer_von: formData.klassenlehrer_von || null,

                  if (editingId === 'new') {
                    await svc.createUser(payload);

                    try {
